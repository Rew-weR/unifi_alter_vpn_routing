# ==============================================================================
# CUSTOM VPN ROUTING SUITE FOR UNIFI OS - PRODUCTION CONFIGURATION
# ==============================================================================
SYSTEM_LANGUAGE="ru"
TOOL_PATH="/data/vpn-router"
LOG_TAG="CustomVPNRouting"
BACKUP_DIR="/data/vpn-router/routes-backup"
MAX_BACKUPS=10

# --- Outbound Targets & Destinations ---
TARGET_WG_INTERFACE_GUI="WG-Zhmyak2"
TARGET_IPSEC_INTERFACE_GUI="CP-DC.IPSEC"

# Фолбэки на случай временного отсутствия линка в ядре при перезагрузке
TARGET_WG_KERNEL_DEFAULT="wgclt4"
TARGET_WG_STATIC_IP_DEFAULT="10.151.0.3"
TARGET_PURE_TABLE_ID_DEFAULT="178"

# --- Inbound Client VPN Networks (Sources) ---
SRC_NETWORKS=(
    "wgsrv1:192.168.6.0/24:PBR_AND_DC"     # WG.WORK
    "tun1:192.168.5.0/24:PBR_AND_DC"      # OVPN.WORK
    "wgsrv3:10.11.12.0/24:PBR_ONLY"       # WG.CLIENTS
    "wgsrv5:192.168.10.0/24:PBR_AND_DC"   # CYPE.MOBILE
    "l2tp0:192.168.3.0/24:PBR_ONLY"       # L2TP.WORK
)

# --- Datacenter Remote Subnets ---
DC_REMOTE_SUBNETS=(
    "172.20.150.0/22"
    "172.20.154.0/24"
    "172.20.155.0/24"
)

# --- Local Networks Isolation (LAN / VLAN Access Protection) ---
LOCAL_SUPERNETS=(
    "172.20.0.0/16"
    "192.168.0.0/16"
)

# --- Routing Priorities (Preferences) ---
PREF_LOCAL_ISOLATION=1000
PREF_IPSEC_INTERCEPT=10500
PREF_VPN_PBR_BASE=2000

# --- Telemetry & Watchdog ---
CHECK_HOSTS=("1.1.1.1" "9.9.9.9" "8.8.8.8")
PING_INTERVAL_MINUTES=5
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# --- Bypass Modules Activation ---
BYPASS_HOSTS_FILE="/data/vpn-router/bypass-hosts.list"
BYPASS_PARTS_DIR="/data/vpn-router/bypass-parts"

# Локальный приоритетный файл (ручной список)
BYPASS_MANUAL_FILE="/data/vpn-router/ipsmart.lst"


# URL-адрес для автоматического скачивания списков (вынесено из скрипта)
BYPASS_REMOTE_URL="https://antifilter.network/download/ipsmart.lst"

BYPASS_HOSTS_FILE="/data/vpn-router/bypass-hosts.list"
BYPASS_PARTS_DIR="/data/vpn-router/bypass-parts"
